
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dropdown List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <div class="header-icon" aria-hidden="true">▾</div>
            <h1>Dynamic Dropdown List</h1>
        </div>
    </header>

    <main class="container">
        <section class="main-card">
            <div class="intro">
                <h2>Pilihan Produk</h2>
                <p>
                    Pilih jenis produk untuk melihat daftar merek
                    yang tersedia sesuai pilihanmu.
                </p>
            </div>

            <form id="productForm">
                <div class="form-group">
                    <label for="product">Jenis Produk</label>
                    <select id="product" required>
                        <option value="">Pilih Jenis Produk</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Smartphone">Smartphone</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="brand">Merek</label>
                    <select id="brand" disabled required>
                        <option value="">Pilih jenis produk terlebih dahulu</option>
                    </select>
                    <p class="help-text" id="brandHelp">
                        Pilihan merek akan muncul setelah jenis produk dipilih.
                    </p>
                </div>

                <button type="button" id="resetButton">
                    Reset Pilihan
                </button>
            </form>
        </section>

        <section class="result-section">
            <h2>Ringkasan Pilihan</h2>
            <div id="result" class="result-card" aria-live="polite">
                <p class="empty-message">
                    Pilih jenis produk dan merek untuk melihat ringkasan.
                </p>
            </div>
        </section>

        <footer>
            <p>Dynamic Dropdown List &mdash; JavaScript Application</p>
        </footer>
    </main>
</body>
</html>
