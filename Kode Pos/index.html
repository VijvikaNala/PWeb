
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kode Pos Indonesia</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
    <div class="header-brand">
        <img
            src="Logo.png"
            alt="Logo Kode Pos Indonesia"
            class="header-logo"
        >
        <h1>Kode Pos Indonesia</h1>
    </div>
</header>

    <main class="container">
        <section class="search-card">
            <p class="description">
                Cari kode pos wilayah Indonesia dengan memilih provinsi,
                kabupaten/kota, dan kecamatan.
            </p>

            <form id="searchForm">
                <div class="form-group">
                    <label for="province">Provinsi</label>
                    <select id="province" required>
                        <option value="">Memuat provinsi...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regency">Kabupaten/Kota</label>
                    <select id="regency" required disabled>
                        <option value="">Pilih Kabupaten/Kota</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="district">Kecamatan</label>
                    <select id="district" required disabled>
                        <option value="">Pilih Kecamatan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="keyword">Masukkan Kata Kunci Pencarian</label>
                    <div class="search-box">
                        <input
                            type="text"
                            id="keyword"
                            placeholder="Contoh: 60111 atau Sukolilo"
                            required
                        >
                        <button type="submit" id="searchButton">
                            Cari
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <section class="results-section">
            <h2>Hasil Pencarian</h2>
            <p id="resultInfo">
                Pilih wilayah dan masukkan kata kunci untuk mencari kode pos.
            </p>

            <div id="results" aria-live="polite">
                <div class="empty-state">
                    Hasil pencarian akan ditampilkan di sini.
                </div>
            </div>
        </section>

        <footer>
            <p>Website Pencarian Kode Pos Indonesia</p>
        </footer>
    </main>
</body>
</html>
