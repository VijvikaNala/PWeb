
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi Mahasiswa</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Form Registrasi Mahasiswa</h1>

    <form id="formRegistrasi">
        <div class="form-group">
            <label for="nama">Nama Mahasiswa</label>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama mahasiswa"
                   autocomplete="off" required>
            <div id="rekomendasiNama"></div>
        </div>

        <div class="form-group">
            <label for="nim">NIM</label>
            <input type="text" id="nim" name="nim"
                   placeholder="Masukkan NIM" required>
        </div>

        <div class="form-group">
            <label for="matkul">Mata Kuliah</label>
            <select id="matkul" name="matkul" required>
                <option value="">Pilih Mata Kuliah</option>
                <option value="PBO">Pemrograman Berorientasi Objek</option>
                <option value="Jarkom">Jaringan Komputer</option>
                <option value="Basis Data">Sistem Basis Data</option>
                <option value="Web">Pemrograman Web</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dosen">Dosen</label>
            <input type="text" id="dosen" name="dosen"
                   placeholder="Masukkan nama dosen" required>
        </div>

        <button type="submit">Daftar</button>
        <button type="reset">Reset</button>
    </form>

    <div id="hasil"></div>

    <script src="script.js"></script>
</body>
</html>
