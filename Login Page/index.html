
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background-color: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 1000px;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .login-image {
            min-height: 550px;
            height: 100%;
            background-image: url(
                "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=85"
            );
            background-size: cover;
            background-position: center;
        }

        .login-form {
            padding: 55px 45px;
        }

        .login-form h1 {
            font-size: 30px;
            font-weight: 700;
            color: #243447;
        }

        .login-form .subtitle {
            color: #7b8794;
            margin-bottom: 32px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 7px;
        }

        .btn-login {
            padding: 12px;
            background-color: #1469e8;
            border: none;
            border-radius: 7px;
            color: white;
            font-weight: 600;
        }

        .btn-login:hover {
            background-color: #1054bd;
            color: white;
        }

        .forgot-link {
            color: #1469e8;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 767px) {
            body {
                padding: 16px;
            }

            .login-image {
                min-height: 220px;
            }

            .login-form {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">
        <div class="row g-0">

            <!-- Left: Image -->
            <div class="col-md-6">
                <div
                    class="login-image"
                    role="img"
                    aria-label="Mountain landscape"
                ></div>
            </div>

            <!-- Right: Login Form -->
            <div class="col-md-6">
                <div class="login-form">

                    <h1>Welcome Back!</h1>
                    <p class="subtitle">
                        Please sign in to your account.
                    </p>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >
                        </div>

                        <div class="d-flex justify-content-between
                                    align-items-center mb-4">

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember"
                                >

                                <label
                                    class="form-check-label"
                                    for="remember"
                                >
                                    Remember me
                                </label>
                            </div>

                            <a href="#" class="forgot-link">
                                Forgot password?
                            </a>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-login w-100"
                        >
                            SIGN IN
                        </button>

                        <p
                            id="loginMessage"
                            class="text-success text-center mt-3 mb-0"
                            aria-live="polite"
                        ></p>

                    </form>

                    <p class="text-center text-secondary mt-4 mb-0">
                        Don't have an account?
                        <a href="#" class="forgot-link">Register</a>
                    </p>

                </div>
            </div>

        </div>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            loginMessage.textContent =
                "Form berhasil diisi! Login belum terhubung ke server.";
        });
    </script>

</body>
</html>
